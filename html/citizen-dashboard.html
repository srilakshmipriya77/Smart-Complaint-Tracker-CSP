<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Citizen Dashboard</title>

    <link rel="stylesheet" href="css/citizen.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>Smart Complaint Tracker</h2>

        <ul>

            <li class="active">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </li>

            <li id="newComplaintBtn">
                <i class="fa-solid fa-plus"></i>
                Register Complaint
            </li>

            <li id="historyBtn">
                <i class="fa-solid fa-list"></i>
                Complaint History
            </li>

            <li id="trackBtn">
                <i class="fa-solid fa-location-dot"></i>
                Track Complaint
            </li>

            <li id="feedbackBtn">
                <i class="fa-solid fa-star"></i>
                Feedback
            </li>

            <li onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </li>

        </ul>

    </aside>


    <!-- Main Content -->

    <main class="main-content">

        <header>

            <h1>Citizen Dashboard</h1>

            <div class="user">

                Welcome,

                <span id="username"></span>

            </div>

        </header>


        <!-- Dashboard Cards -->

        <section class="cards">

            <div class="card">

                <i class="fa-solid fa-file-circle-check"></i>

                <h2 id="totalComplaints">0</h2>

                <p>Total Complaints</p>

            </div>

            <div class="card pending">

                <i class="fa-solid fa-hourglass-half"></i>

                <h2 id="pendingComplaints">0</h2>

                <p>Pending</p>

            </div>

            <div class="card progress">

                <i class="fa-solid fa-spinner"></i>

                <h2 id="progressComplaints">0</h2>

                <p>In Progress</p>

            </div>

            <div class="card completed">

                <i class="fa-solid fa-circle-check"></i>

                <h2 id="completedComplaints">0</h2>

                <p>Completed</p>

            </div>

        </section>


        <!-- Recent Complaints -->

        <section class="recent">

            <h2>Recent Complaints</h2>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Category</th>

                        <th>Status</th>

                        <th>Department</th>

                        <th>Date</th>

                    </tr>

                </thead>

                <tbody id="complaintTable">

                </tbody>

            </table>

        </section>

    </main>

</div>

<script src="js/storage.js"></script>
<script src="js/citizen.js"></script>

</body>

</html>
