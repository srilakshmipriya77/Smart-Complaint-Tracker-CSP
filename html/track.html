<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Complaint</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/track.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>Smart Complaint Tracker</h2>

        <ul>

            <li onclick="location.href='citizen-dashboard.html'">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </li>

            <li onclick="location.href='complaint.html'">
                <i class="fa-solid fa-plus"></i>
                Register Complaint
            </li>

            <li onclick="location.href='history.html'">
                <i class="fa-solid fa-clock-rotate-left"></i>
                Complaint History
            </li>

            <li class="active">
                <i class="fa-solid fa-location-dot"></i>
                Track Complaint
            </li>

            <li onclick="location.href='feedback.html'">
                <i class="fa-solid fa-star"></i>
                Feedback
            </li>

            <li onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main-content">

        <h1>Track Complaint</h1>

        <div class="search-box">

            <input
                type="text"
                id="complaintId"
                class="form-control"
                placeholder="Enter Complaint ID">

            <button
                id="trackBtn"
                class="btn btn-primary">

                <i class="fa-solid fa-magnifying-glass"></i>

                Track

            </button>

        </div>

        <div id="result" style="display:none;">

            <div class="card shadow p-4">

                <h3 id="title"></h3>

                <hr>

                <div class="row">

                    <div class="col-md-6">

                        <p><strong>Complaint ID :</strong> <span id="complaintNo"></span></p>

                        <p><strong>Category :</strong> <span id="category"></span></p>

                        <p><strong>Status :</strong> <span id="status"></span></p>

                        <p><strong>Priority :</strong> <span id="priority"></span></p>

                    </div>

                    <div class="col-md-6">

                        <p><strong>Department :</strong> <span id="department"></span></p>

                        <p><strong>Officer :</strong> <span id="officer"></span></p>

                        <p><strong>Remarks :</strong> <span id="remarks"></span></p>

                        <p><strong>Date :</strong> <span id="date"></span></p>

                    </div>

                </div>

                <div class="text-center mt-4">

                    <img
                        id="complaintImage"
                        class="img-fluid rounded shadow"
                        style="display:none;max-height:300px;">

                </div>

            </div>

            <!-- Timeline -->

            <div class="timeline mt-4">

                <div class="step" id="step1">

                    <i class="fa-solid fa-file-circle-check"></i>

                    <p>Submitted</p>

                </div>

                <div class="step" id="step2">

                    <i class="fa-solid fa-user-check"></i>

                    <p>Assigned</p>

                </div>

                <div class="step" id="step3">

                    <i class="fa-solid fa-spinner"></i>

                    <p>In Progress</p>

                </div>

                <div class="step" id="step4">

                    <i class="fa-solid fa-circle-check"></i>

                    <p>Completed</p>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="js/storage.js"></script>
<script src="js/track.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
