<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Feedback</title>

    <link rel="stylesheet" href="css/feedback.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <aside class="sidebar">

        <h2>Smart Complaint Tracker</h2>

        <ul>

            <li onclick="location.href='citizen-dashboard.html'">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </li>

            <li onclick="location.href='complaint.html'">
                <i class="fa-solid fa-plus"></i>
                Register Complaint
            </li>

            <li onclick="location.href='history.html'">
                <i class="fa-solid fa-clock-rotate-left"></i>
                Complaint History
            </li>

            <li onclick="location.href='track.html'">
                <i class="fa-solid fa-location-dot"></i>
                Track Complaint
            </li>

            <li class="active">
                <i class="fa-solid fa-star"></i>
                Feedback
            </li>

            <li onclick="logout()">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </li>

        </ul>

    </aside>

    <main class="main-content">

        <h1>Complaint Feedback</h1>

        <div class="feedback-card">

            <form id="feedbackForm">

                <label>Select Complaint</label>

                <select id="complaintSelect" required>

                    <option value="">Choose Complaint</option>

                </select>

                <label>Rating</label>

                <select id="rating" required>

                    <option value="">Select Rating</option>

                    <option value="5">⭐⭐⭐⭐⭐ Excellent</option>

                    <option value="4">⭐⭐⭐⭐ Very Good</option>

                    <option value="3">⭐⭐⭐ Good</option>

                    <option value="2">⭐⭐ Fair</option>

                    <option value="1">⭐ Poor</option>

                </select>

                <label>Your Feedback</label>

                <textarea
                id="comment"
                rows="5"
                placeholder="Write your feedback..."
                required></textarea>

                <button type="submit">

                    <i class="fa-solid fa-paper-plane"></i>

                    Submit Feedback

                </button>

            </form>

        </div>

        <div class="feedback-history">

            <h2>My Feedback</h2>

            <table>

                <thead>

                    <tr>

                        <th>Complaint</th>

                        <th>Rating</th>

                        <th>Comment</th>

                    </tr>

                </thead>

                <tbody id="feedbackTable">

                </tbody>

            </table>

        </div>

    </main>

</div>

<script src="js/storage.js"></script>
<script src="js/feedback.js"></script>

</body>
</html>
