    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- Main Content -->

    <main class="main-content">

        <header>

            <h1>Officer Dashboard</h1>

            <div class="welcome">

                Welcome,

                <span id="officerName"></span>

            </div>
            <button class="logout welcome" onclick="logout()">Logout</button>
        </header>

        <!-- Dashboard Cards -->

        <section class="cards">

            <div class="card">

                <i class="fa-solid fa-folder-open"></i>

                <h2 id="assignedCount">0</h2>

                <p>Assigned</p>

            </div>

            <div class="card pending">

                <i class="fa-solid fa-hourglass-half"></i>

                <h2 id="pendingCount">0</h2>

                <p>Pending</p>

            </div>

            <div class="card progress" id="progress">

                <i class="fa-solid fa-spinner" style="margin-top: 10px;"></i>

                <h2 id="progressCount">0</h2>

                <p style="margin-bottom: 10px;">In Progress</p>

            </div>

            <div class="card completed">

                <i class="fa-solid fa-circle-check"></i>

                <h2 id="completedCount">0</h2>

                <p>Completed</p>

            </div>

        </section>

        <!-- Complaint Table -->

        <section class="complaints" id="assignedComplaints">

            <div class="table-header">

                <h2>Assigned Complaints</h2>

                <input
                    type="text"
                    id="searchComplaint"
                    class="form-control"
                    placeholder="Search Complaint ID">

            </div>

            <table class="table table-hover">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Citizen</th>

                        <th>Category</th>

                        <th>Priority</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="officerTable">

                </tbody>

            </table>

        </section>

    </main>

</div>

<!-- ===========================
     View Complaint Modal
=========================== -->

<div class="modal fade" id="viewModal" tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header bg-primary text-white">

                <h5 class="modal-title">
                    Complaint Details
                </h5>

                <button
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <table class="table table-bordered">

                    <tr>
                        <th>Complaint ID</th>
                        <td id="viewId"></td>
                    </tr>

                    <tr>
                        <th>Citizen</th>
                        <td id="viewCitizen"></td>
                    </tr>

                    <tr>
                        <th>Category</th>
                        <td id="viewCategory"></td>
                    </tr>

                    <tr>
                        <th>Title</th>
                        <td id="viewTitle"></td>
                    </tr>

                    <tr>
                        <th>Description</th>
                        <td id="viewDescription"></td>
                    </tr>

                    <tr>
                        <th>Location</th>
                        <td id="viewLocation"></td>
                    </tr>

                    <tr>
                        <th>Department</th>
                        <td id="viewDepartment"></td>
                    </tr>

                    <tr>
                        <th>Priority</th>
                        <td id="viewPriority"></td>
                    </tr>

                    <tr>
                        <th>Status</th>
                        <td id="viewStatus"></td>
                    </tr>

                    <tr>
                        <th>Officer</th>
                        <td id="viewOfficer"></td>
                    </tr>

                    <tr>
                        <th>Remarks</th>
                        <td id="viewRemarks"></td>
                    </tr>

                </table>

                <img
                    id="viewImage"
                    class="img-fluid rounded shadow"
                    style="display:none;max-height:300px;">

            </div>

        </div>

    </div>

</div>

<!-- ===========================
     Update Status Modal
=========================== -->

<div class="modal fade" id="updateModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header bg-success text-white">

                <h5 class="modal-title">
                    Update Complaint
                </h5>

                <button
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input
                    type="hidden"
                    id="updateComplaintId">

                <div class="mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    <select
                        id="updateStatus"
                        class="form-select">

                        <option>Pending</option>
                        <option>In Progress</option>
                        <option>Completed</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Inspection Remarks
                    </label>

                    <textarea
                        id="updateRemarks"
                        class="form-control"
                        rows="4"></textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Upload Completion Image
                    </label>

                    <input
                        type="file"
                        id="completionImage"
                        class="form-control"
                        accept="image/*">

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    class="btn btn-success"
                    onclick="saveComplaintUpdate()">

                    Save Changes

                </button>

            </div>

        </div>

    </div>

</div>

<script src="js/storage.js"></script>
<script src="js/officer.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
