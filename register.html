<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Smart Complaint Tracker</title>

    <link rel="stylesheet" href="css/register.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <div class="logo">
                <i class="fa-solid fa-building"></i>
                <h2>Smart Complaint Tracker</h2>
            </div>

            <h1>Create Account</h1>
            <p class="subtitle">Register to access the complaint portal</p>

            <form id="registerForm">

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="Enter your mobile number" maxlength="10" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                </div>

                <div class="input-group">
                    <label>Select Role</label>

                    <select id="role" required>
                        <option value="">Choose Role</option>
                        <option value="citizen">Citizen</option>
                        <option value="officer">Officer</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <div class="input-group" id="departmentField" style="display:none;">
                    <label>Department</label>

                    <select id="department">
                        <option value="">Select Department</option>
                        <option>Roads</option>
                        <option>Water Supply</option>
                        <option>Electricity</option>
                        <option>Sanitation</option>
                        <option>Street Lights</option>
                    </select>
                </div>

                <button type="submit">
                    <i class="fa-solid fa-user-plus"></i>
                    Register
                </button>

            </form>

            <div class="links">
                <a href="login.html">Already have an account?</a>
                <a href="index.html">← Back to Home</a>
            </div>

        </div>

    </div>

    <script>
        const role = document.getElementById("role");
        const departmentField = document.getElementById("departmentField");

        role.addEventListener("change", () => {
            if (role.value === "officer") {
                departmentField.style.display = "block";
            } else {
                departmentField.style.display = "none";
            }
        });
    </script>

    <script src="js/storage.js"></script>
    <script src="js/register.js"></script>

</body>

</html>
