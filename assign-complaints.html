<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Assign Complaints</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="css/assign-complaints.css">
        <link rel="stylesheet" href="css/admin.css">
    </head>
    <body>
        <div class="sidebar">
            <h3 class="text-center text-white py-3">
                Smart Complaint Tracker
            </h3>
            <ul>
                <li onclick="window.location.href='admin-dashboard.html'">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </li>
                <li onclick="window.location.href='manage-citizens.html'">
                    <i class="fa-solid fa-users"></i>
                    Manage Citizens
                </li>
                <li onclick="window.location.href='manage-officers.html'">
                    <i class="fa-solid fa-user-tie"></i>
                    Manage Officers
                </li>
                <li onclick="window.location.href='manage-departments.html'">
                    <i class="fa-solid fa-building"></i>
                    Departments
                </li>
                <li class="active"
                    onclick="window.location.href='assign-complaints.html'">
                    <i class="fa-solid fa-list-check"></i>
                    Assign Complaints
                </li>
                <li onclick="window.location.href='reports.html'">
                    <i class="fa-solid fa-chart-column"></i>
                    Reports
                </li>
                <li onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </li>
            </ul>
        </div>
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fa-solid fa-list-check"></i>Assign Complaints</h2>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <input
                    type="text"
                    id="searchComplaint"
                    class="form-control"
                    placeholder="Search Complaint">
                </div>
            </div>
            <table class="table table-bordered table-hover">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Citizen</th>
                        <th>Category</th>
                        <th>Department</th>
                        <th>Status</th>
                        <th>Officer</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="complaintTable"></tbody>
            </table>
        </div>
        <!-- Assign Modal -->
        <div class="modal fade" id="assignModal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title">
                        Assign Complaint
                        </h5>
                        <button
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                    </button>
                    </div>
                    <div class="modal-body">
                        <input
                        type="hidden"
                        id="complaintId">
                        <div class="mb-3">
                            <label>Department</label>
                            <select
                            id="department"
                            class="form-select">
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Officer</label>
                            <select
                            id="officer"
                            class="form-select">
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button class="btn btn-success" onclick="assignComplaint()">  Assign </button>
                    </div>
                </div>
            </div>
        </div>
        <script src="js/storage.js"></script>
        <script src="js/assign-complaints.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
